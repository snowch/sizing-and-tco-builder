dsl: 1
model: tiny
title: Blank result
currency: USD

nodes:

  request_rate:
    kind: input
    decided: outside
    unit: request/second
    value: 200
    provenance: {kind: assumption, source: "the busy hour, as stated for this case"}

  service_demand:
    kind: input
    decided: outside
    unit: core*second/request
    value: 0.02
    provenance: {kind: assumption, source: "processor time per request, as stated for this case"}

  cores:
    kind: input
    decided: you
    unit: core
    value: 16
    provenance: {kind: assumption, source: "the fleet chosen for this case"}

  busy_cores:
    kind: derived
    unit: core
    formula: request_rate * service_demand

  queueing_margin:
    kind: input
    decided: you
    unit: dimensionless
    value: 0.3
    provenance: {kind: assumption, source: "the margin kept below the knee in this case"}

  utilisation_ceiling:
    kind: ceiling
    unit: dimensionless
    of: busy_cores / cores
    limit: 1
    headroom: queueing_margin
    because: "past the knee the queue grows faster than the load"

  compression:
    kind: measured
    unit: dimensionless
    result: ""

  compressed_cores:
    kind: derived
    unit: core
    formula: busy_cores / compression

outputs:
  - utilisation_ceiling
  - compressed_cores
