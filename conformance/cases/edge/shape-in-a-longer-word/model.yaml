dsl: 2
model: tiny
title: Lognormal named
currency: USD

nodes:

  request_rate:
    kind: input
    decided: outside
    unit: request/second
    value: 200
    provenance: {kind: assumption, source: "the busy hour, as stated for this case"}

  service_demand:
    kind: input
    decided: outside
    unit: core*second/request
    value: 0.02
    provenance: {kind: assumption, source: "processor time per request, as stated for this case"}

  cores:
    kind: input
    decided: you
    unit: core
    value: 16
    provenance: {kind: assumption, source: "the fleet chosen for this case"}

  busy_cores:
    kind: derived
    unit: core
    formula: request_rate * service_demand

  utilisation:
    kind: derived
    unit: dimensionless
    formula: busy_cores / cores

  a_rate:
    kind: input
    decided: outside
    unit: request/second
    distribution: {lognormal: {p10: 100.0, p90: 300.0}}
    provenance: {kind: assumption, source: "lognormal: a rate that cannot go below zero"}

outputs:
  - utilisation
  - a_rate
