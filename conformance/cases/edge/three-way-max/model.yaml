dsl: 2
model: tiny
title: Three chains
currency: USD

nodes:

  request_rate:
    kind: input
    decided: outside
    unit: request/second
    value: 200
    provenance: {kind: assumption, source: "the busy hour, as stated for this case"}

  service_demand:
    kind: input
    decided: outside
    unit: core*second/request
    value: 0.02
    provenance: {kind: assumption, source: "processor time per request, as stated for this case"}

  cores:
    kind: input
    decided: you
    unit: core
    value: 16
    provenance: {kind: assumption, source: "the fleet chosen for this case"}

  busy_cores:
    kind: derived
    unit: core
    formula: request_rate * service_demand

  utilisation:
    kind: derived
    unit: dimensionless
    formula: busy_cores / cores

  a_hosts:
    kind: input
    decided: you
    unit: host
    value: 3
    provenance: {kind: assumption, source: "stated for this case"}

  b_hosts:
    kind: input
    decided: you
    unit: host
    value: 7
    provenance: {kind: assumption, source: "stated for this case"}

  c_hosts:
    kind: input
    decided: you
    unit: host
    value: 5
    provenance: {kind: assumption, source: "stated for this case"}

  binding:
    kind: derived
    unit: host
    formula: max(a_hosts, b_hosts, c_hosts)

outputs:
  - utilisation
  - binding
