dsl: 2
model: tiny
title: scenario edges
currency: USD

nodes:

  request_rate:
    kind: input
    decided: outside
    unit: request/second
    value: 200
    provenance: {kind: assumption, source: "the busy hour, as stated for this case"}

  service_demand:
    kind: input
    decided: outside
    unit: core*second/request
    value: 0.02
    provenance: {kind: assumption, source: "processor time per request, as stated for this case"}

  cores:
    kind: input
    decided: you
    unit: core
    value: 16
    provenance: {kind: assumption, source: "the fleet chosen for this case"}

  busy_cores:
    kind: derived
    unit: core
    formula: request_rate * service_demand

  utilisation:
    kind: derived
    unit: dimensionless
    formula: busy_cores / cores

  stored:
    kind: input
    decided: outside
    unit: TB
    value: 15
    provenance: {kind: assumption, source: "what is held, as stated for this case"}

  index:
    kind: input
    decided: outside
    unit: GB
    value: 500
    provenance: {kind: assumption, source: "the index, as stated for this case"}

  disk_per_host:
    kind: input
    decided: outside
    unit: TB/host
    value: 2
    provenance: {kind: assumption, source: "the disk each host has, as stated for this case"}

  margin:
    kind: input
    decided: you
    unit: dimensionless
    value: 0.2
    provenance: {kind: assumption, source: "stated for this case"}

  fill:
    kind: ceiling
    unit: TB
    of: stored
    limit: disk_per_host * cores / cores * 10 * one_host
    headroom: margin
    because: "stated for this case"

  one_host:
    kind: input
    decided: definition
    unit: host
    value: 1
    provenance: {kind: fact, source: "definition"}

  compression:
    kind: measured
    unit: dimensionless
    result: records-compression

  compressed:
    kind: derived
    unit: TB
    formula: stored / compression

outputs:
  - utilisation
  - fill
  - compressed
  - index
