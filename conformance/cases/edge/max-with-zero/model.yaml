dsl: 2
model: tiny
title: Max with zero
currency: USD

nodes:

  request_rate:
    kind: input
    decided: outside
    unit: request/second
    value: 200
    provenance: {kind: assumption, source: "the busy hour, as stated for this case"}

  service_demand:
    kind: input
    decided: outside
    unit: core*second/request
    value: 0.02
    provenance: {kind: assumption, source: "processor time per request, as stated for this case"}

  cores:
    kind: input
    decided: you
    unit: core
    value: 16
    provenance: {kind: assumption, source: "the fleet chosen for this case"}

  busy_cores:
    kind: derived
    unit: core
    formula: request_rate * service_demand

  utilisation:
    kind: derived
    unit: dimensionless
    formula: busy_cores / cores

  need:
    kind: input
    decided: outside
    unit: TB
    value: 40
    provenance: {kind: assumption, source: "stated for this case"}

  have:
    kind: input
    decided: outside
    unit: TB
    value: 25
    provenance: {kind: assumption, source: "stated for this case"}

  to_buy:
    kind: derived
    unit: TB
    formula: max(0, need - have)

outputs:
  - utilisation
  - to_buy
