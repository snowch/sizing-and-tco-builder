name: CI

on:
  push:
  pull_request:

jobs:
  fixtures:
    # The committed fixtures are exactly what the book's toolkit says at the pinned commit. If a
    # case, a probe or the pin changes and nobody regenerated, this fails and names the files.
    name: Fixtures match the pinned book, which reads what the engine writes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: .book
          key: book-${{ runner.os }}-py3.11-${{ hashFiles('book.lock.json') }}
      - run: python3 conformance/generate.py --check
      # Every model the engine writes back out is read by the book's toolkit as the original is.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 conformance/roundtrip.py

  engine:
    # The builder's engine agrees with the book on every case, or this fails.
    name: Engine agrees with the book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The spreadsheet export is recalculated by a spreadsheet application and held to the book.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc-nogui
      - run: npm ci
      - run: npm test
        env:
          REQUIRE_SOFFICE: "1"

  flows:
    # The builder in a browser, as a reader drives it, with every file it writes handed to the
    # book's own toolkit at the pinned commit.
    name: Flows, checked by the book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: .book
          key: book-${{ runner.os }}-py3.11-${{ hashFiles('book.lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends libreoffice-calc-nogui
      - run: npm run flows
        env:
          REQUIRE_SOFFICE: "1"
